name: Release

on:
  push:
    tags:
      - 'R*'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build addon zip
        run: git archive --format=zip --prefix=RuriWigs/ -o "RuriWigs-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "RuriWigs-${GITHUB_REF_NAME}.zip"
          --title "$GITHUB_REF_NAME"
          --generate-notes
